[package]
name = "ruddy"
version = "0.1.0"
edition = "2024"
# `tests/` is the workspace's test crate, not this package's integration tests.
autotests = false

[workspace]
members = ["cli", "debug", "esparse", "tests"]

[build-dependencies]
twox-hash = { version = "2.1.3", default-features = false, features = ["xxhash3_64"] }

[dependencies]
batsat = "0.6.0"
esparse = { path = "esparse" }
indexmap = "2"
salsa = { version = "0.28.2", default-features = false, features = ["macros", "inventory"] }
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
twox-hash = { version = "2.1.3", default-features = false, features = ["xxhash3_64"] }
unicode-width = "0.2"

# The debugger is served from a dev build. Optimizing the dependencies alone
# — the SAT solver under inference, the JavaScript parser that validates
# generated modules, Git — costs nothing on a rebuild of this workspace and
# leaves its own code as debuggable as before. `opt-level = 1` for the
# workspace itself halves the debugger's compile time again, at the price of
# roughly twice the incremental rebuild `just dev` waits for.
[profile.dev.package."*"]
opt-level = 3

# The JavaScript recognizer is a leaf of the workspace that changes rarely,
# so optimizing it costs a rebuild nothing and keeps validation of a generated
# module to a few milliseconds in the debugger.
[profile.dev.package.esparse]
opt-level = 3
