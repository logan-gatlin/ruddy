<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ruddy-debug</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>&#128029;</text></svg>"
    />
  </head>
  <body>
    <header id="titlebar">
      <span class="brand">ruddy<span class="brand-dim">-debug</span></span>

      <button id="doc-button" class="chip" title="Switch document (Ctrl+P)">
        <span id="doc-name">…</span>
        <span class="caret">▾</span>
      </button>

      <span
        id="bundle"
        class="chip bundle"
        title="Bundle identity supplied to the compiler — click to edit"
        >…</span
      >

      <button id="root" class="chip" title="Configured root source file">main.hc</button>
      <select id="kind" class="chip" aria-label="Bundle kind"><option value="library">library</option><option value="executable">executable</option></select>
      <select id="target" class="chip" aria-label="Output target"><option value="">default target</option><option value="artifact">artifact</option><option value="js">js</option></select>
      <select id="platform" class="chip" aria-label="Runtime platform"><option value="">default platform</option><option value="node">node</option><option value="web">web</option></select>
      <button id="std" class="chip" title="Automatic standard library">std: default</button>
      <button id="dependencies" class="chip" title="Path and HTTPS Git dependencies">no dependencies</button>

      <span id="timings" class="timings"></span>

      <span class="spacer"></span>

      <button id="follow" class="chip toggle" title="Follow the caret (Ctrl+.)">follow</button>
      <button id="split" class="chip toggle" title="Split panels (Ctrl+B)">split</button>
      <span id="link" class="chip status" title="Connection to the debug server">…</span>
    </header>

    <main id="workbench">
      <section id="editor-pane">
        <div id="files" class="files"></div>
        <div id="editor-host"></div>
      </section>
      <div id="drag" title="Drag to resize"></div>
      <section id="panes"></section>
    </main>

    <footer id="diagnostics"></footer>

    <div id="overlay" hidden>
      <div class="dialog">
        <input id="overlay-input" spellcheck="false" autocomplete="off" placeholder="document…" />
        <ul id="overlay-list"></ul>
        <div class="dialog-hint">↑↓ choose · ⏎ open · type a new name to create · esc cancel</div>
      </div>
    </div>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
